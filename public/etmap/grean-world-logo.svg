<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="50" viewBox="0 0 300 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="50" rx="8" fill="url(#logoGradient)"/>
  
  <!-- Header Logo Image -->
  <image 
    href="GreanWorld.jpg"
    x="10" 
    y="5" 
    height="40" 
    width="40"
    preserveAspectRatio="xMidYMid meet"
  />
  
  <!-- Text -->
  <text x="60" y="30" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="24">
    GREAN WORLD
  </text>
  <text x="60" y="45" fill="white" font-family="Arial, sans-serif" font-size="12">
    ENERGY TECHNOLOGY PLC
  </text>
</svg> 